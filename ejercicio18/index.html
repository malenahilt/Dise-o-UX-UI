<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid avanzado: galería tipo mosaico (Masonry-like)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Galeria de imagenes</h1>
    <div class="galeria">
        <div class="item grande"><img src="alicia.png" alt="libro alicia y el pais de las maravillas"></div>
        <div class="item ancho"><img src="RyJ.png" alt="Libro Romeo y Julieta"></div>
        <div class="item"><img src="laNM.png" alt="libro la naranja mecanica"></div>
        <div class="item grande"><img src="CyC.png" alt="libro crimen y castigo"></div>
        <div class="item alto"><img src="1984.png" alt="libro 1984"></div>
        <div class="item"><img src="odisea.png" alt="libro la odisea"></div>
        <div class="item"><img src="NochesBlancas.png" alt="libro noches Noches Blancas"></div>
        <div class="item alto"><img src="elPrincipito.png" alt="libro el principito"></div>
        <div class="item"><img src="DQdlM.png" alt="libro don quijote de la mancha"></div>
        <div class="item grande"><img src="AñosdeSoledad.png" alt="libro 100 años de soledad"></div>
        <div class="item alto"><img src="mujercitas.png" alt="libro mujercitas"></div>
        <div class="item"><img src="OyP.png" alt="libro Orgullo y prejuicio"></div>
        <div class="iten alto"><img src="indigno.png" alt="libro indigno de ser humano"></div>
    </div>
</body>
</html>
