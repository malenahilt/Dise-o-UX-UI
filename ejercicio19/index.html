<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario multi-step con validación visual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="formulario-wrapper">

    <!-- Radios ocultos que controlan qué paso se muestra -->
    <input type="radio" name="paso" id="paso1" class="paso-radio" checked>
    <input type="radio" name="paso" id="paso2" class="paso-radio">

    <!-- Indicador visual de progreso -->
    <div class="indicador">
      <label for="paso1" class="punto">1</label>
      <span class="linea"></span>
      <label for="paso2" class="punto">2</label>
    </div>

    <form action="#" method="post">

      <!-- ===== PASO 1 ===== -->
      <section class="paso paso-1">
        <h2>Paso 1: Datos personales</h2>

        <div class="campo">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" required minlength="2">
          <span class="mensaje-error">Ingrese su nombre.</span>
        </div>

        <div class="campo">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
          <span class="mensaje-error">Ingrese su email.</span>
        </div>

        <label for="paso2" class="btn btn-siguiente">Siguiente →</label>
      </section>

      <!-- ===== PASO 2 ===== -->
      <section class="paso paso-2">
        <h2>Paso 2: Datos de acceso</h2>

        <div class="campo">
          <label for="usuario">Usuario:</label>
          <input type="text" id="usuario" name="usuario" required minlength="4">
          <span class="mensaje-error">El usuario debe tener al menos 6 caracteres.</span>
        </div>

        <div class="campo">
          <label for="clave">Contraseña:</label>
          <input type="password" id="clave" name="clave" required minlength="6">
          <span class="mensaje-error">La contraseña debe tener al menos 6 caracteres y ser segura.</span>
        </div>

        <label for="paso1" class="btn btn-volver">← Volver</label>
        <button type="submit" class="btn btn-enviar">Registrarme</button>
      </section>
    </form>
  </div>
</body>
</html>
