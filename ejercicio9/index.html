<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de tarjetas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Productos disponibles</h1>

    <div class="Productos"></div>

    <div class="card">
        <img src="remera.png" alt="remera azul">
        <h2>Producto 1</h2>
        <costo class="precio">$20,000</costo>
        <button>comprar</button>
    </div>

    <div class="card">
        <img src="pantalon.png" alt="pantalon beige">
        <h2>producto 2</h2>
        <costo class="precio">$25,000</costo>
        <button>comprar</button>
    </div>

    <div class="card">
        <img src="campera.png" alt="campera adidas">
        <h2>producto 3</h2>
        <costo class="precio">$30,000</costo>
        <button>comprar</button>
    </div>

    <div class="card">
        <img src="buzo.png" alt="buzo negro">
        <h2>producto 4</h2>
        <costo class="precio">$28,000</costo>
        <button>comprar</button>
    </div>

    <div class="card">
        <img src="zapatilas.png" alt="zapatilas urbanas">
        <h2>producto 5</h2>
        <costo class="precio">$50,000</costo>
        <button>comprar</button>
    </div>

    <div class="card">
        <img src="gorra.png" alt="gorra beisbol">
        <h2>producto 6</h2>
        <costo class="precio">$15,000</costo>
        <button>comprar</button>
    </div>
</body>
</html>
