<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu responsivo solo hamburguesa</title>
    <link rel="stylesheet" href="stily.css">
</head>
<body>
     <header class="navbar">
    <div class="logo">Logo</div>

    <!-- checkbox oculto: guarda el estado abierto/cerrado -->
    <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Abrir menú de navegación">
    
    <!-- Label asociado: es el ícono que se clickea -->
    <label for="menu-toggle" class="menu-icono"></label>

    <nav class="menu">
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Servicios</a></li>
        <li><a href="#">Productos</a></li>
        <li><a href="#">Contacto</a></li>
        <li><a href="#">Nosotros</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contenido de la página</h1>
    <p>Achicá la ventana por debajo de 768px para ver el menú colapsado.</p>
  </main>
</body>
</html>
